name: mino
description: Mino - 深色科技风专注计时与纪念日应用
publish_to: 'none'
version: 0.5.0+6

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.3
  firebase_core: any
  firebase_auth: any
  cloud_firestore: any
  flutter_local_notifications: ^19.0.0
  timezone: any
  audioplayers: ^6.0.0
  wakelock_plus: any
  path_provider: any
  share_plus: ^10.1.4

dev_dependencies:
  flutter_launcher_icons: ^0.14.0
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0A0E1A"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#0A0E1A"
  image: assets/icon/splash.png
  android_12:
    color: "#0A0E1A"
    image: assets/icon/splash.png
