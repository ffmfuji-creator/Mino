name: Build Mino Android

on:
  workflow_dispatch:
    inputs:
      build_aab:
        description: '同时生成 AAB（上架 Google Play 用）'
        type: boolean
        default: false
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      MINO_KEYSTORE_PASSWORD: ${{ secrets.MINO_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform folders and place source files
        run: |
          flutter --version
          flutter create --project-name mino --org com.mino --platforms=android,ios .
          mkdir -p lib
          mv -f *.dart lib/
          rm -rf test analysis_options.yaml

      - name: Restore release keystore (if configured)
        env:
          KS: ${{ secrets.MINO_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > android/app/mino-release.jks
            echo "Release keystore restored"
          else
            echo "No release keystore configured: falling back to debug signing"
          fi

      - name: Patch Android project
        run: python3 patch_android.py

      - name: Generate icons
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pil
          python3 make_icon.py

      - name: Get packages
        run: flutter pub get

      - name: Launcher icon
        continue-on-error: true
        run: dart run flutter_launcher_icons

      - name: Splash screen
        continue-on-error: true
        run: dart run flutter_native_splash:create

      - name: Analyze (informational)
        run: flutter analyze --no-fatal-infos || true

      - name: Build release APK
        run: flutter build apk --release

      - name: Show APK signing certificate
        run: keytool -printcert -jarfile build/app/outputs/flutter-apk/app-release.apk | head -8

      - name: Build release AAB (optional)
        if: ${{ github.event.inputs.build_aab == 'true' }}
        run: flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        with:
          name: mino-android-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
